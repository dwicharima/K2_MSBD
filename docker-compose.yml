services:
  postgres:
    image: postgres:17
    container_name: msbd-pg
    environment:
      POSTGRES_USER: msbd
      POSTGRES_PASSWORD: msbd2026
      POSTGRES_DB: latihan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dump:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msbd -d latihan"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:8
    container_name: msbd-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: msbd
      MONGO_INITDB_ROOT_PASSWORD: msbd2026
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: msbd-redis
    ports:
      - "6379:6379"

  flyway:
    image: flyway/flyway:11
    depends_on:
      - postgres
    volumes:
      - ./latihan/p02/migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/latihan
      -user=msbd
      -password=msbd2026
      -connectRetries=10
      migrate

volumes:
  pgdata:
  mongodata: